<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1d8e" stop-opacity="1" />
      <stop offset="55%" stop-color="#1a0d3e" stop-opacity="1" />
      <stop offset="100%" stop-color="#060608" stop-opacity="1" />
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.3" fill="#a78bfa" fill-opacity="0.45" />
    </pattern>
    <pattern id="grid" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M 180 0 L 0 0 0 180" fill="none" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#060608" />
  <rect width="1920" height="1080" fill="url(#glow)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <rect width="1920" height="1080" fill="url(#dots)" />
</svg>
